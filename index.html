<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global History Atlas - Immersive Glass Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <style>
        /* FIXED DESKTOP ENFORCEMENT: Guarantees map box canvas renders 100% size attributes on laptops */
        #map-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 350px; /* Prevents desktop container collapsing */
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background: transparent !important; 
        }

        .leaflet-popup-content-wrapper {
            background-color: rgba(26, 26, 30, 0.95) !important;
            backdrop-filter: blur(8px) !important;
            color: #ffffff !important;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .leaflet-popup-tip { background-color: rgba(26, 26, 30, 0.95) !important; }
        .transition-all { transition: all 0.3s ease-in-out; }
        
        /* Ancient Woven Carpet Background Pattern Matrix */
        .carpet-tapestry-bg {
            background-color: #0c0a09;
            background-image: 
                radial-gradient(rgba(217, 119, 6, 0.15) 1px, transparent 0),
                radial-gradient(rgba(120, 113, 108, 0.15) 1px, transparent 0);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            padding: 12px;
        }

        /* Frosted Glassmorphism Map Panel Styling Layer */
        .glass-framer-panel {
            background: rgba(22, 22, 26, 0.55) !important;
            backdrop-filter: blur(16px) saturate(140%) !important;
            -webkit-backdrop-filter: blur(16px) saturate(140%) !important;
            border: 2px solid rgba(251, 191, 36, 0.15) !important;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.05) !important;
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #16161a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #2e2e3e; border-radius: 3px; }
    </style>
</head>
